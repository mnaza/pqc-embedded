[package]
name = "lms-verify"
description = "no_std, allocation-free LMS (RFC 8554) signature verification for firmware boot"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["sha2"]
# Software SHA-256. Switch off when supplying a hardware backend, so the software
# implementation is not linked in alongside it.
sha2 = ["dep:sha2"]

[dependencies]
sha2 = { workspace = true, optional = true }

[dev-dependencies]
rand = { workspace = true }
ct-probe = { path = "../ct-probe" }
sha2 = { workspace = true, features = ["std"] }
